[project]
name = "paperchat-api"
version = "0.1.0"
description = "PaperChat API foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "pymupdf>=1.28.2",
    "langchain-core>=1.6.10",
    "langchain-text-splitters>=1.1.3",
    "langchain-qdrant>=1.1.0",
    "langchain-openai>=1.7.2",
    "qdrant-client>=1.19.1",
    "langchain-openrouter>=0.2.9",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<1",
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
